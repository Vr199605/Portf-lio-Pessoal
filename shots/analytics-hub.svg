<svg width="1600" height="500" viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E14"/>
      <stop offset="1" stop-color="#141d29"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2531" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)" opacity="0.55"/>
  <circle cx="1360" cy="90" r="240" fill="#00D9B5" opacity="0.08"/>
  <circle cx="220" cy="440" r="200" fill="#FFB43C" opacity="0.05"/>
  <text x="60" y="70" font-family="'IBM Plex Mono',monospace" font-size="17" fill="#00D9B5" letter-spacing="3">PROJETO 07</text>

  <!-- dashboard mock: bar chart card -->
  <g transform="translate(120,150)">
    <rect x="0" y="0" width="300" height="200" rx="12" fill="#111823" stroke="#212c3a" stroke-width="2"/>
    <text x="18" y="30" font-family="'IBM Plex Mono',monospace" font-size="12" fill="#8B98AA">RECEITA</text>
    <g fill="#00D9B5">
      <rect x="20" y="120" width="26" height="55" rx="3"/>
      <rect x="58" y="95" width="26" height="80" rx="3"/>
      <rect x="96" y="70" width="26" height="105" rx="3"/>
      <rect x="134" y="105" width="26" height="70" rx="3" opacity="0.6"/>
      <rect x="172" y="55" width="26" height="120" rx="3"/>
    </g>
  </g>

  <!-- line chart card -->
  <g transform="translate(460,150)">
    <rect x="0" y="0" width="360" height="200" rx="12" fill="#111823" stroke="#212c3a" stroke-width="2"/>
    <text x="18" y="30" font-family="'IBM Plex Mono',monospace" font-size="12" fill="#8B98AA">TENDÊNCIA</text>
    <polyline points="20,150 70,120 120,135 170,90 220,100 270,55 320,70" fill="none" stroke="#FFB43C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="320" cy="70" r="6" fill="#FFB43C"/>
  </g>

  <!-- donut + kpi card -->
  <g transform="translate(860,150)">
    <rect x="0" y="0" width="260" height="200" rx="12" fill="#111823" stroke="#212c3a" stroke-width="2"/>
    <text x="18" y="30" font-family="'IBM Plex Mono',monospace" font-size="12" fill="#8B98AA">MIX</text>
    <circle cx="130" cy="120" r="55" fill="none" stroke="#212c3a" stroke-width="18"/>
    <circle cx="130" cy="120" r="55" fill="none" stroke="#00D9B5" stroke-width="18" stroke-dasharray="220 345" stroke-linecap="round" transform="rotate(-90 130 120)"/>
  </g>

  <!-- table card -->
  <g transform="translate(1160,150)">
    <rect x="0" y="0" width="320" height="200" rx="12" fill="#111823" stroke="#212c3a" stroke-width="2"/>
    <text x="18" y="30" font-family="'IBM Plex Mono',monospace" font-size="12" fill="#8B98AA">KPIs</text>
    <g stroke="#212c3a" stroke-width="1">
      <line x1="18" y1="48" x2="302" y2="48"/>
      <line x1="18" y1="88" x2="302" y2="88"/>
      <line x1="18" y1="128" x2="302" y2="128"/>
      <line x1="18" y1="168" x2="302" y2="168"/>
    </g>
    <circle cx="290" cy="68" r="4" fill="#00D9B5"/>
    <circle cx="290" cy="108" r="4" fill="#FFB43C"/>
    <circle cx="290" cy="148" r="4" fill="#00D9B5"/>
  </g>

  <text x="800" y="420" font-family="'Space Grotesk',sans-serif" font-size="34" font-weight="700" fill="#E9EDF3" text-anchor="middle">Victor Analytics Hub</text>
  <text x="800" y="448" font-family="'IBM Plex Mono',monospace" font-size="13" fill="#8B98AA" text-anchor="middle" letter-spacing="2">POWER BI · DASHBOARDS · CICLO COMPLETO DE DADOS</text>
  <rect x="0" y="494" width="1600" height="6" fill="#00D9B5"/>
</svg>
