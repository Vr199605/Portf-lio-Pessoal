<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E14"/>
      <stop offset="1" stop-color="#141d29"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2531" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)" opacity="0.55"/>
  <circle cx="660" cy="80" r="190" fill="#00D9B5" opacity="0.08"/>

  <text x="40" y="56" font-family="'IBM Plex Mono',monospace" font-size="15" fill="#00D9B5" letter-spacing="3">PROJETO 08</text>

  <!-- shield + dollar (security) -->
  <g transform="translate(310,90)">
    <path d="M70 0 L138 24 L138 82 C138 128 108 158 70 172 C32 158 2 128 2 82 L2 24 Z"
      fill="#111823" stroke="#00D9B5" stroke-width="6" stroke-linejoin="round"/>
    <text x="70" y="102" font-family="'IBM Plex Mono',monospace" font-size="52" font-weight="700" fill="#00D9B5" text-anchor="middle">$</text>
  </g>

  <!-- target (goals) -->
  <g transform="translate(470,150)" stroke="#FFB43C" fill="none">
    <circle cx="0" cy="0" r="42" stroke-width="6"/>
    <circle cx="0" cy="0" r="26" stroke-width="5"/>
    <circle cx="0" cy="0" r="7" fill="#FFB43C" stroke="none"/>
  </g>

  <text x="400" y="382" font-family="'Space Grotesk',sans-serif" font-size="30" font-weight="700" fill="#E9EDF3" text-anchor="middle">Secure Financial Now</text>
  <text x="400" y="410" font-family="'IBM Plex Mono',monospace" font-size="12.5" fill="#8B98AA" text-anchor="middle" letter-spacing="2">ORÇAMENTO · METAS · RECOMENDAÇÕES</text>
  <rect x="0" y="494" width="800" height="6" fill="#00D9B5"/>
</svg>
